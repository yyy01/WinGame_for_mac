[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wingame-for-mac"
version = "0.1.0"
description = "Manifest-driven macOS launchers for locally owned Windows games"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
wgfm = "wgfm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wgfm = ["resources/*.m", "resources/*.c"]
